services:
  olog:
    build: .
    ports:
      - "8080:8080"
      - "8181:8181"
    environment:
      MONGO_HOST: mongo
      ELASTICSEARCH_NETWORK_HOST: elasticsearch
      SHIFT_URL: http://shift-mock:8080/Shift/resources
      SHIFT_TYPE: Operations
    depends_on:
      mongo:
        condition: service_started
      elastic:
        condition: service_healthy
      shift-mock:
        condition: service_started

  shift-mock:
    image: wiremock/wiremock:3.13.0
    ports:
      - "8282:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - olog-mongodata:/data/db

  elastic:
    image: elasticsearch:8.2.3
    environment:
      cluster.name: elasticsearch
      bootstrap.memory_lock: "true"
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
    hostname: elasticsearch
    ports:
      - "9200:9200"
    volumes:
      - olog-esdata:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: curl -f http://elasticsearch:9200/_cluster/health
      interval: 5s
      timeout: 60s
      retries: 10

volumes:
  olog-esdata:
    driver: local
  olog-mongodata:
    driver: local
